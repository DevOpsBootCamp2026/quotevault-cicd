name: CI

on:
    push:
        branches: [ main ]
        tags: [ 'v*.*.*' ]
    pull_request:
        branches: [ main ]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-python@v6
              with:
                  python-version: '3.12'
                  cache: pip
                  cache-dependency-path: requirements*.txt
            - run: pip install -r requirements-dev.txt
            - run: flake8 quotevault

    unit-tests:
        needs: [lint]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-python@v6
              with:
                  python-version: '3.12'
                  cache: pip
                  cache-dependency-path: requirements*.txt
            - run: pip install -r requirements.txt -r requirements-dev.txt
            - run: pytest tests/unit -q

    api-tests:
        needs: [lint]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-python@v6
              with:
                  python-version: '3.12'
                  cache: pip
                  cache-dependency-path: requirements*.txt
            - run: pip install -r requirements.txt -r requirements-dev.txt
            - run: pytest tests/api -q

    docker-build:
        needs: [unit-tests, api-tests]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Build image
              run: docker build -t quotevault:ci .

            - name: Run container
              run: docker run -d --name quotevault-ci -p 8000:8000 quotevault:ci

            - name: Smoke test /health
              run: |
                for attempt in $(seq 1 15); do
                    if curl -fsS http://localhost:8000/health | grep -q '"ok"'; then
                        echo "health check passed on attempt ${attempt}"
                        exit 0
                    fi
                    echo "health check attempt ${attempt} failed, retrying in 2s"
                    sleep 2
                done
                echo "health check never answered on http://localhost:8000/health"
                docker logs quotevault-ci
                exit 1

            - name: Cleanup container
              if: always()
              run: docker rm -f quotevault-ci || true
